name: Deploy API to Hugging Face Space

on:
  push:
    branches: [main]
    paths: ["api/**", "src/**", "models/**", "configs/**", "results/*.json", "Dockerfile", "requirements-api.txt",
            "deploy/**", ".github/workflows/hf-space.yml"]
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install huggingface_hub
      - run: python deploy/hf_space.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}   # write token (Settings > Secrets and variables > Actions)
          HF_SPACE: ${{ vars.HF_SPACE }}      # e.g. your-username/patra-api
