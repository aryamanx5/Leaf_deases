# Central configuration. Scripts read this file; no magic numbers in code.
seed: 42

paths:
  raw: data/raw
  downloads: data/downloads
  processed: data/processed
  inventory: data/processed/inventory.csv
  splits: data/processed/splits.csv
  features: data/processed/features.csv
  cache: data/processed/cache
  results: results
  figures: results/figures
  models: models

crops: [turmeric, blackgram]
labels: [healthy, diseased]

# Public datasets (Mendeley Data). Files are fetched through the public API and
# verified against the sha256 the API reports. Original class folder names are
# mapped to healthy/diseased; classes mapped to null are excluded (not leaves).
datasets:
  blackgram:
    mendeley_id: zfcv9fmrgv
    version: 3
    files: ["BPLD Dataset.zip"]
    citation: "Talasila et al., Black gram Plant Leaf Disease (BPLD) dataset, Data in Brief 45 (2022) 108725, doi:10.17632/zfcv9fmrgv.3"
    class_map:
      healthy: healthy
      anthracnose: diseased
      leaf crinkle: diseased
      leaf crinckle: diseased    # spelling used in the BPLD archive
      powdery mildew: diseased
      yellow mosaic: diseased
  turmeric:
    mendeley_id: g46dvrcvwn
    version: 2
    files: ["Turmeric Plant Disease.zip"]   # original images only; the augmented zip is NOT used (R2)
    citation: "A data-driven approach to turmeric disease detection: Dataset for plant condition classification, Data in Brief 59 (2025) 111435, doi:10.17632/g46dvrcvwn.2"
    class_map:
      healthy leaf: healthy
      leaf blotch: diseased
      dry leaf: diseased
      rhizome disease root: null      # rhizome (root) images are not leaves: excluded
      rhizome healthy root: null

split:
  ratios: {train: 0.70, val: 0.15, test: 0.15}
  dedup:                   # near-duplicate rules (pHash 64-bit "d64" and 256-bit "d256")
    strong_d256: 54        # calibrated on inspected pairs: <=52 were all the same leaf
    medium_d64: 6
    medium_d256: 70
    burst_index_gap: 3     # consecutive file numbers in one class = burst shots
    burst_d64: 12
  stem_grouping: true      # strip augmentation suffixes from filenames before grouping

preprocess:
  max_side: 512            # resize longest side to this before processing
  median_ksize: 5
  gaussian_ksize: 5
  clahe_clip: 2.0
  clahe_tile: 8

segment:
  hue_min: 8              # OpenCV hue 0-180; 8 ~ brown/orange, 95 ~ blue-green
  hue_max: 90             # turmeric's white paper reads as hue 75-104 with low saturation
  sat_min: 22             # dull dark leaves on cloth can be as low as ~25
  val_min: 30
  pale_hue_min: 20        # pale tissue (mildew / chlorosis): yellow-green, low saturation
  pale_hue_max: 65
  pale_sat_min: 12
  pale_val_min: 140
  ring_frac: 0.05         # border ring used to decide plain vs field background
  plain_bg_min_frac: 0.25 # >= this share of the ring is non-plant -> plain mode (bimodal: field <0.2, card >0.6)
  bg_clusters: 3          # k-means background colours (paper + ruled lines + table, ...)
  bg_min_cluster_share: 0.12
  bg_val_min: 110         # background candidates must be at least this bright (HSV V)
  l_weight: 0.35          # down-weight lightness so shadows stay background
  dist_min: 12            # clamp on the Otsu threshold of the colour distance
  dist_max: 60
  plain_centre_weight: 0.3
  field_centre_weight: 1.0
  grabcut_side: 256       # GrabCut runs on a downscaled copy for speed
  grabcut_iters: 5
  centre_frac: 0.75       # central ellipse treated as probable leaf
  core_frac: 0.20         # central core treated as definite leaf (if plant-coloured)
  core_dist_min: 15       # lower clamp on the Otsu split of colour distance to the core
  border_frac: 0.03       # outer border treated as definite background
  open_ksize: 5
  plain_open_ksize: 9     # larger opening detaches textured backgrounds (soil grains) in plain mode
  close_ksize: 9
  fallback_min_coverage: 0.08   # below this GrabCut is assumed to have collapsed
  fallback_max_coverage: 0.95   # a colour fallback covering the whole frame is not a leaf
  solidity_margin: 0.03         # core-seeded GrabCut must beat loose seeding by this much
  quality: {min_dominant_share: 0.8, min_coverage: 0.05, max_coverage: 0.95}
lesions: {}
features: {}
decide: {}
cnn: {}
