# Central configuration. Scripts read this file; no magic numbers in code.
seed: 42

paths:
  raw: data/raw
  downloads: data/downloads
  processed: data/processed
  inventory: data/processed/inventory.csv
  splits: data/processed/splits.csv
  features: data/processed/features.csv
  cache: data/processed/cache
  results: results
  figures: results/figures
  models: models

crops: [turmeric, blackgram]
labels: [healthy, diseased]

# Public datasets (Mendeley Data). Files are fetched through the public API and
# verified against the sha256 the API reports. Original class folder names are
# mapped to healthy/diseased; classes mapped to null are excluded (not leaves).
datasets:
  blackgram:
    mendeley_id: zfcv9fmrgv
    version: 3
    files: ["BPLD Dataset.zip"]
    citation: "Talasila et al., Black gram Plant Leaf Disease (BPLD) dataset, Data in Brief 45 (2022) 108725, doi:10.17632/zfcv9fmrgv.3"
    class_map:
      healthy: healthy
      anthracnose: diseased
      leaf crinkle: diseased
      leaf crinckle: diseased    # spelling used in the BPLD archive
      powdery mildew: diseased
      yellow mosaic: diseased
  turmeric:
    mendeley_id: g46dvrcvwn
    version: 2
    files: ["Turmeric Plant Disease.zip"]   # original images only; the augmented zip is NOT used (R2)
    citation: "A data-driven approach to turmeric disease detection: Dataset for plant condition classification, Data in Brief 59 (2025) 111435, doi:10.17632/g46dvrcvwn.2"
    class_map:
      healthy leaf: healthy
      leaf blotch: diseased
      dry leaf: diseased
      rhizome disease root: null      # rhizome (root) images are not leaves: excluded
      rhizome healthy root: null

split:
  ratios: {train: 0.70, val: 0.15, test: 0.15}
  dedup:                   # near-duplicate rules (pHash 64-bit "d64" and 256-bit "d256")
    strong_d256: 54        # calibrated on inspected pairs: <=52 were all the same leaf
    medium_d64: 6
    medium_d256: 70
    burst_index_gap: 3     # consecutive file numbers in one class = burst shots
    burst_d64: 12
  stem_grouping: true      # strip augmentation suffixes from filenames before grouping

preprocess:
  max_side: 512            # resize longest side to this before processing
  median_ksize: 5
  gaussian_ksize: 5
  clahe_clip: 2.0
  clahe_tile: 8
  # clahe_enabled: true    # optional flag (default true). CLAHE (Lab L only) feeds texture/edge
  #                        # features; segmentation and colour features use the non-CLAHE image.

segment:
  hue_min: 8              # OpenCV hue 0-180; 8 ~ brown/orange, 95 ~ blue-green
  hue_max: 90             # turmeric's white paper reads as hue 75-104 with low saturation
  sat_min: 22             # dull dark leaves on cloth can be as low as ~25
  val_min: 30
  pale_hue_min: 20        # pale tissue (mildew / chlorosis): yellow-green, low saturation
  pale_hue_max: 65
  pale_sat_min: 12
  pale_val_min: 140
  ring_frac: 0.05         # border ring used to decide plain vs field background
  plain_bg_min_frac: 0.25 # >= this share of the ring is non-plant -> plain mode (bimodal: field <0.2, card >0.6)
  bg_clusters: 3          # k-means background colours (paper + ruled lines + table, ...)
  bg_min_cluster_share: 0.12
  bg_val_min: 110         # background candidates must be at least this bright (HSV V)
  l_weight: 0.35          # down-weight lightness so shadows stay background
  dist_min: 12            # clamp on the Otsu threshold of the colour distance
  dist_max: 60
  plain_centre_weight: 0.3
  field_centre_weight: 1.0
  grabcut_side: 256       # GrabCut runs on a downscaled copy for speed
  grabcut_iters: 5
  centre_frac: 0.75       # central ellipse treated as probable leaf
  core_frac: 0.20         # central core treated as definite leaf (if plant-coloured)
  core_dist_min: 15       # lower clamp on the Otsu split of colour distance to the core
  border_frac: 0.03       # outer border treated as definite background
  open_ksize: 5
  plain_open_ksize: 9     # larger opening detaches textured backgrounds (soil grains) in plain mode
  close_ksize: 9
  fallback_min_coverage: 0.08   # below this GrabCut is assumed to have collapsed
  fallback_max_coverage: 0.95   # a colour fallback covering the whole frame is not a leaf
  # P2-B06 single leaf among foliage (marker-controlled watershed)
  foliage_a_margin: 4           # a* below 128 - this is "green"
  foliage_sat_min: 40
  ws_sigma_frac: 0.008          # gradient smoothing relative to the image size
  ws_core_frac: 0.06            # leaf marker radius (fraction of the short side)
  ws_far_factor: 1.3            # background marker: colour distance > factor x max(Otsu, min)
  ws_dist_min: 18
  plain_tex_max: 13             # plain mode needs a smooth background (median L* gradient); measured:
                                # training plain backgrounds median 2.6-3.8 (p90 11.4), wild field 12.6+ (p10)
  uniform_ring_tex_max: 5       # a border this uniform is a plain backdrop even if plant-coloured (studio wall)
  solidity_margin: 0.03         # core-seeded GrabCut must beat loose seeding by this much
  quality: {min_dominant_share: 0.8, min_coverage: 0.05, max_coverage: 0.95}
lesions:
  # Calibrated on TRAIN leaf-pixel statistics (OpenCV HSV: H 0-180; Lab offset 128).
  # healthy hue median: black gram ~50, turmeric ~41; yellow-mosaic/blotch/dry pixels
  # concentrate at H 20-30, brown/necrotic at H < 20.
  default:
    green_hue_min: 34
    green_hue_max: 85
    green_sat_min: 40
    min_green_px: 200
    default_green_hue: 45
    yellow_hue_gap: 9        # yellow = hue at least this far below the leaf's own green ...
    yellow_hue_max: 33       # ... and below this absolute hue
    yellow_sat_min: 70
    yellow_val_min: 80
    brown_hue_max: 20        # brown/orange: hue < 20 ...
    red_hue_min: 150         # ... or red/purple hue >= 150 (anthracnose margins)
    brown_sat_min: 45
    dark_val_ratio: 0.45     # darker than 45% of the leaf's median V (or dark_val_abs) ...
    dark_val_abs: 55         # absolute floor: a fully necrotic leaf has no green reference
    dark_sat_max: 50         # ... with non-green hue or low saturation
    pale_chroma_ratio: 0.65  # powdery mildew: chroma below 65% of the leaf's ...
    pale_l_gain: 15          # ... and lighter than the leaf by this much (grid on train: mildew 8.6% vs healthy 0.9%)
    pale_l_max: 235          # ... but not a specular highlight
    hyst_l_weight: 0.5       # hysteresis: relaxed mask = Lab distance from reference green ...
    hyst_dist_min: 38        # ... above max(Otsu, this floor), kept only where touching a seed (train grid: AUC flat 22-999, 38 limits healthy inflation)
    edge_margin: 3           # px of leaf outline ignored
    open_ksize: 2            # P2-B06: smaller opening keeps small specks (v1: 3)
    close_ksize: 3           # (v1: 5) less merging of neighbouring specks
    min_lesion_px: 8         # adaptive min area = max(8 px, 0.0002 x leaf area) (v1: 25 px, 0.0005)
    min_lesion_frac: 0.0002
    speck_ksize: 9           # top-hat structuring element (px at 1x; covers 2x at 0.5x)
    speck_scales: [1.0, 0.5]
    speck_dark_delta: 18     # black top-hat depth in L* levels for a dark speck
    speck_bright_delta: 22   # white top-hat height for a bright (pale) speck
  per_crop:
    turmeric:
      green_hue_min: 32
      default_green_hue: 41
    blackgram:
      green_hue_min: 36
features:
  min_leaf_frac: 0.01      # below this the segmentation is treated as failed (whole frame used)
  glcm_levels: 32
  glcm_distances: [1, 2, 4]
  glcm_angles: [0, 45, 90, 135]
  glcm_max_side: 256       # leaf bounding box is downscaled to this for GLCM
  canny_low: 50
  canny_high: 150
decide:
  rule:
    weights: {affected_pct: 1.0, log_lesion_count: 1.0, abn_colour_pct: 1.0, glcm_contrast: 1.0}
    threshold_grid: {start: 0.0, stop: 1.0, num: 201}   # per-crop threshold chosen on VAL (macro-F1)
  svm:
    C: [0.3, 1, 3, 10, 30, 100]
    gamma: [scale, 0.003, 0.01, 0.03, 0.1]
    cv_folds: 5
  timing_images: 40        # VAL images timed sequentially for per-image inference ms
cnn:
  arch: mobilenet_v2       # or efficientnet_b0
  pretrained: true
  image_size: 224
  cache_side: 288          # decoded images kept in memory at this size
  batch_size: 32
  augment:                 # TRAIN split only, applied at load time
    crop_scale: [0.6, 1.0]
    rotation: 20
    brightness: 0.2
    contrast: 0.2
    saturation: 0.15
    hue: 0.02              # small: colour carries the disease signal
  stage1: {epochs: 6, lr: 0.001, unfreeze_last_blocks: 0}     # head only
  stage2: {epochs: 20, lr: 0.0002, unfreeze_last_blocks: 4}   # last blocks + head
  weight_decay: 0.0001
  label_smoothing: 0.0
  early_stopping_patience: 5   # on VAL binary macro-F1 (stage 2)
  time_budget_min: 40          # stop training (keeping the best checkpoint) after this
  smoke: {n_images: 64, epochs: 1}
  gradcam_images: 8

pipeline:
  min_side: 64             # smaller images are rejected
  min_plant_fraction: 0.05 # share of leaf-coloured pixels below which the input is "not a leaf"
  ood_reject_plant_fraction: 0.25   # OOD-flagged AND less leaf colour than this -> "not a leaf"

wild:                      # out-of-distribution evaluation set (never used for training)
  root: data/wild
  max_side: 1600           # downloaded images are stored downscaled to this
  sample_seed: 42
  mendeley:
    - crop: turmeric
      id: jtttfbx342       # Bangladesh smartphone field photos, CC BY 4.0
      version: 2
      citation: "Image Dataset for Turmeric Plant Leaf Disease Detection, Mendeley Data, doi:10.17632/jtttfbx342.2"
      licence: CC BY 4.0
      classes: {healthy: [healthy, 25], blotch: [diseased, 15], leaf_spot: [diseased, 15]}   # originals only (no aug_*)
    - crop: blackgram
      id: z55yrbmn2d       # Bangladesh black gram field photos, CC BY 4.0
      version: 3
      citation: "Image Dataset for Disease Detection in Black Gram (Vigna mungo) Leaves, Mendeley Data, doi:10.17632/z55yrbmn2d.3"
      licence: CC BY 4.0
      classes: {healthy: [healthy, 30], cercospora leaf spot: [diseased, 15], leaf crinkle: [diseased, 10], yellow mosaic: [diseased, 15]}
  inaturalist:             # field scenes; labels "unknown" (disease not verifiable from the record)
    licences: [cc0, cc-by, cc-by-sa]
    taxa: {turmeric: Curcuma longa, blackgram: Vigna mungo}
    max_per_crop: 40
  commons:                 # Wikimedia Commons search, openly licensed only (no NC/ND), label "unknown"
    turmeric:
      queries: ["Curcuma longa leaves", "turmeric plant", "turmeric field", "turmeric farm"]
      include: "(?i)(leaves|leaf|plant|field|farm)"
      exclude: "(?i)(inflorescence|flower|powder|rhizome|root|onion|patoli|dal|cuisine)"
    blackgram:
      queries: ["black gram plant", "Vigna mungo plant", "urad dal plant", "black gram field"]
      include: "(?i)(plant|field|leaf|leaves)"
      exclude: "(?i)(gruel|bag|dosa|seed|caterp|instar|radiata|sweet|cicer|dal phaseolus)"
    max_per_crop: 20
  exclude:                 # visual vetting before any evaluation: not a leaf photo
    - {path: data/wild/turmeric/unknown/commons_Curcuma_sp_Nativeplants_Botanical_Garden_87289_.jpg, reason: "flower is the subject (Curcuma sp.)"}
    - {path: data/wild/turmeric/unknown/commons_Curcuma_sp_Nativeplants_Botanical_Garden.jpg, reason: "flower is the subject (Curcuma sp.)"}
    - {path: data/wild/blackgram/unknown/commons_Black_gram_field_Maravanthe.jpg, reason: "distant field, no leaf discernible"}
    - {path: data/wild/blackgram/unknown/commons_Urad_dal_plant.jpg, reason: "dry field, no leaf discernible"}
    - {path: data/wild/turmeric/unknown/inat_2712346_3056556.jpg, reason: "flower is the subject"}
    - {path: data/wild/turmeric/unknown/inat_9831881_13463052.jpg, reason: "flower is the subject"}
    - {path: data/wild/turmeric/unknown/inat_14454467_21515279.jpg, reason: "flower is the subject"}
    - {path: data/wild/turmeric/unknown/inat_15006457_22387891.jpg, reason: "rhizome slices, not a leaf"}
    - {path: data/wild/turmeric/unknown/inat_15880100_23747562.jpg, reason: "flower is the subject"}
    - {path: data/wild/turmeric/unknown/inat_20179893_31142499.jpg, reason: "flower is the subject"}
    - {path: data/wild/turmeric/unknown/inat_25983655_40306598.jpg, reason: "flower is the subject"}
    - {path: data/wild/turmeric/unknown/inat_29688806_46346864.jpg, reason: "flower is the subject"}
    - {path: data/wild/turmeric/unknown/inat_30744251_48049191.jpg, reason: "flower is the subject"}
    - {path: data/wild/turmeric/unknown/inat_40747879_64592926.jpg, reason: "flower is the subject"}
    - {path: data/wild/turmeric/unknown/inat_41153877_65261594.jpg, reason: "rhizomes, not a leaf"}
    - {path: data/wild/turmeric/unknown/inat_42412144_67339679.jpg, reason: "flower is the subject"}
    - {path: data/wild/turmeric/unknown/inat_42897202_68112075.jpg, reason: "flower is the subject"}
    - {path: data/wild/turmeric/unknown/inat_62768139_100627331.jpg, reason: "flower is the subject"}
    - {path: data/wild/turmeric/unknown/inat_67672364_109394966.jpg, reason: "flower is the subject"}
    - {path: data/wild/turmeric/unknown/inat_68327092_110607418.jpg, reason: "flower is the subject"}
    - {path: data/wild/turmeric/unknown/inat_89603908_147988762.jpg, reason: "flower is the subject"}
    - {path: data/wild/turmeric/unknown/inat_91383597_151147388.jpg, reason: "flower is the subject"}
    - {path: data/wild/turmeric/unknown/inat_92895470_153883908.jpg, reason: "flower is the subject"}
    - {path: data/wild/turmeric/unknown/inat_95720864_158942877.jpg, reason: "flower is the subject"}
    - {path: data/wild/turmeric/unknown/inat_100768608_168216099.jpg, reason: "flower is the subject"}
    - {path: data/wild/turmeric/unknown/inat_102923357_172151897.jpg, reason: "flower is the subject"}
    - {path: data/wild/turmeric/unknown/inat_105434151_176902664.jpg, reason: "flower is the subject"}
    - {path: data/wild/turmeric/unknown/inat_105789377_177580054.jpg, reason: "flower is the subject"}
    - {path: data/wild/blackgram/unknown/inat_60946013_97482460.jpg, reason: "flower is the subject"}

augment:                   # P2-B03 background-swap + robust augmentation (TRAIN only)
  leaf_max_side: 320
  bg_side: 256
  canvas_side: 288
  p_swap: 0.75             # share of samples composited onto a new background
  p_bank_background: 0.5   # inpainted TRAIN backgrounds (both crops) vs procedural / plain
  p_collage: 0.35          # add 1-3 same-crop leaves to mimic field scenes
  leaf_scale: [0.45, 0.95]
  crop_scale: [0.25, 1.0]
  rotation: 25
  brightness: 0.3
  contrast: 0.3
  saturation: 0.2
  hue: 0.02
  p_blur: 0.25
  blur_max: 2.0
  p_jpeg: 0.5
  jpeg_q: [40, 95]
  p_erase: 0.25

robust:                    # P2-B04 hierarchical crop + disease models
  train_views_per_image: 8 # background-swap views per TRAIN image for frozen-backbone heads
  crop_candidates: [dinov2_vits14, openclip_vitb32]
  head_C: [0.1, 1.0, 10.0] # logistic-regression C, chosen on clean VAL log-loss
  clip_prompts:
    turmeric: ["a photo of a turmeric leaf", "a photo of turmeric plant leaves", "a photo of a Curcuma longa leaf"]
    blackgram: ["a photo of a black gram leaf", "a photo of black gram (urad) plant leaves", "a photo of a Vigna mungo leaf"]
  crop_cnn:
    arch: efficientnet_b0
    batch_size: 32
    patience: 3
    time_budget_min: 12
    stages:
      - {epochs: 2, lr: 0.001, unfreeze_last_blocks: 0}
      - {epochs: 8, lr: 0.0002, unfreeze_last_blocks: 3}
  disease_cnn:
    arch: mobilenet_v2
    batch_size: 32
    patience: 5
    time_budget_min: 20
    stages:
      - {epochs: 4, lr: 0.001, unfreeze_last_blocks: 0}
      - {epochs: 22, lr: 0.0002, unfreeze_last_blocks: 4}
  latency_images: 10

p3:                        # Phase 3 model upgrade (frozen backbones, fusion, trust layer)
  # Selection rule (all phases of P3): the wild set is NEVER used to fit, tune, select or
  # calibrate. Model selection uses clean VAL plus "val_swap" (each VAL leaf composited once
  # onto a TRAIN-bank / procedural background, no collage) as a non-wild robustness proxy.
  embed_cache: .cache/embeddings
  backbones: [dinov2_vits14, openclip_vitb32, bioclip2]
  train_swap_views: 4      # background-swap views per TRAIN image for frozen-backbone heads
  head_C: [0.01, 0.1, 1.0, 10.0]
  bootstrap: 1000
  conformal_alpha: 0.10    # target coverage 90%
  ood_quantile: 0.95       # kNN OOD threshold = this quantile of in-distribution VAL distances
  ood_k: 10
  quality: {blur_min: 30.0, dark_max: 0.6, bright_max: 0.6, min_leaf_frac: 0.03}
  severity_cuts: {mild: 5.0, moderate: 15.0}   # heuristic: affected % <5 mild, 5-15 moderate, >15 severe
  crop_prompts:
    turmeric: ["a photo of a Curcuma longa (turmeric) leaf"]
    blackgram: ["a photo of a Vigna mungo (black gram) leaf"]
    other: ["a photo of something that is not a leaf", "a photo of soil, a hand or an object"]
  cnn_arms:                # C1-C3 disease CNNs (crop-conditioned 2-logit head, as in Phase 2)
    batch_size: 32
    patience: 4
    arms:
      - {name: C1_mobilenet_v2, arch: mobilenet_v2, time_budget_min: 20, reuse_swap: models/disease_cnn.pt,
         stages: [{epochs: 4, lr: 0.001, unfreeze_last_blocks: 0}, {epochs: 22, lr: 0.0002, unfreeze_last_blocks: 4}]}
      - {name: C2_efficientnet_b0, arch: efficientnet_b0, time_budget_min: 15,
         stages: [{epochs: 3, lr: 0.001, unfreeze_last_blocks: 0}, {epochs: 15, lr: 0.0002, unfreeze_last_blocks: 3}]}
      - {name: C3_convnext_tiny, arch: convnext_tiny, time_budget_min: 20,
         stages: [{epochs: 2, lr: 0.001, unfreeze_last_blocks: 0}, {epochs: 10, lr: 0.0001, unfreeze_last_blocks: 2}]}

wild_ext:                  # extended field test set (evaluation ONLY: no training, tuning, calibration or selection)
  root: data/wild_ext
  max_side: 1600
  seed: 7                  # different from the wild set's sample seed
  sources:
    - {kind: mendeley_files, id: jtttfbx342, version: 2, crop: turmeric, licence: CC BY 4.0,
       citation: "Image Dataset for Turmeric Plant Leaf Disease Detection, Mendeley Data, doi:10.17632/jtttfbx342.2",
       classes: {healthy: [healthy, 120], blotch: [diseased, 120], leaf_spot: [diseased, 120]}}   # aphids: pest, excluded
    - {kind: mendeley_zip, id: z55yrbmn2d, version: 3, crop: blackgram, licence: CC BY 4.0,
       citation: "Image Dataset for Disease Detection in Black Gram (Vigna mungo) Leaves, Mendeley Data, doi:10.17632/z55yrbmn2d.3",
       classes: {healthy: [healthy, 100], cercospora leaf spot: [diseased, 100], leaf crinkle: [diseased, 100],
                 yellow mosaic: [diseased, 100]}}                                                   # insect: pest, excluded
    - {kind: mendeley_boxes, id: 45djgf3p96, version: 2, crop: blackgram, licence: CC BY 4.0,
       citation: "Hridoy et al., Black Gram Leaf Image Dataset for Disease Detection in Field Conditions, Mendeley Data, doi:10.17632/45djgf3p96",
       boxes: {LA: [healthy, 250], LC: [diseased, 250]}, min_box_side: 128, pad: 0.05,               # LB flea beetle: pest, excluded
       scenes: 150}                                                                                  # whole field images, crop label only
    - {kind: mendeley_zip_other, id: 89rfgtxbdc, version: 1, licence: CC BY 4.0, zip: "Original Image Dataset.zip", per_folder: 12,
       citation: "A medicinal plant leaf image dataset for plant health condition detection and classification, Mendeley Data, doi:10.17632/89rfgtxbdc.1"}

field_val:                 # field VALIDATION split (docs/PLAN_field_validation.md): selection + calibration ONLY
  root: data/field_val
  max_side: 1600
  seed: 11
  exclude_sets: [data/wild_ext/labels.csv]   # plus data/wild: no image, field scene or capture minute shared with a test set
  sources:
    - {kind: mendeley_files, id: jtttfbx342, version: 2, crop: turmeric, licence: CC BY 4.0,
       citation: "Image Dataset for Turmeric Plant Leaf Disease Detection, Mendeley Data, doi:10.17632/jtttfbx342.2",
       classes: {healthy: [healthy, 999], blotch: [diseased, 999], leaf_spot: [diseased, 999]}}    # everything left
    - {kind: mendeley_zip, id: z55yrbmn2d, version: 3, crop: blackgram, licence: CC BY 4.0,
       citation: "Image Dataset for Disease Detection in Black Gram (Vigna mungo) Leaves, Mendeley Data, doi:10.17632/z55yrbmn2d.3",
       classes: {healthy: [healthy, 100], cercospora leaf spot: [diseased, 100], leaf crinkle: [diseased, 100],
                 yellow mosaic: [diseased, 100]}}
    - {kind: mendeley_boxes, id: 45djgf3p96, version: 2, crop: blackgram, licence: CC BY 4.0,
       citation: "Hridoy et al., Black Gram Leaf Image Dataset for Disease Detection in Field Conditions, Mendeley Data, doi:10.17632/45djgf3p96",
       boxes: {LA: [healthy, 250], LC: [diseased, 250]}, min_box_side: 128, pad: 0.05, scenes: 0}   # only scenes unused by wild_ext
    - {kind: mendeley_zip_other, id: 89rfgtxbdc, version: 1, licence: CC BY 4.0, zip: "Original Image Dataset.zip", per_folder: 12,
       citation: "A medicinal plant leaf image dataset for plant health condition detection and classification, Mendeley Data, doi:10.17632/89rfgtxbdc.1"}
